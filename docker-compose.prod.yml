# Distinct project name so `docker compose -f docker-compose.prod.yml down` can never match the
# development stack's containers (both files otherwise default to project "eventforge" and share
# service names).
name: eventforge-prod

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventforge-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}
      POSTGRES_DB: ${POSTGRES_DB:-eventforge}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-eventforge}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - eventforge-net

  redis:
    image: redis:7-alpine
    container_name: eventforge-prod-redis
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - eventforge-net

  # One-off job: applies pending database migrations, then exits. api and worker only start
  # after it completes successfully, so a failed migration stops the deploy instead of
  # starting new code against an old schema.
  migrate:
    build: *api-build
    image: eventforge-api:latest
    container_name: eventforge-prod-migrate
    restart: 'no'
    command: ['node', 'packages/database/dist/scripts/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}@postgres:5432/${POSTGRES_DB:-eventforge}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventforge-net

  api:
    build: *api-build
    image: eventforge-api:latest
    container_name: eventforge-prod-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}@postgres:5432/${POSTGRES_DB:-eventforge}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_KEY_MAX: ${RATE_LIMIT_KEY_MAX:-1200}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-2400}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      ALLOW_LOCAL_WEBHOOKS: 'false'
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_RECEIVER_URL: ${SANDBOX_RECEIVER_URL:-http://api:3000/sandbox/receiver}
      SANDBOX_SESSIONS_PER_HOUR: ${SANDBOX_SESSIONS_PER_HOUR:-10}
      SANDBOX_WRITES_PER_HOUR: ${SANDBOX_WRITES_PER_HOUR:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - eventforge-net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: eventforge-worker:latest
    container_name: eventforge-prod-worker
    restart: unless-stopped
    # No published ports: the worker's health/metrics server is reachable only on the
    # internal Docker network (its own healthcheck runs inside the container).
    environment:
      NODE_ENV: production
      WORKER_PORT: 3001
      WORKER_HOST: '0.0.0.0'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}@postgres:5432/${POSTGRES_DB:-eventforge}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      DELIVERY_LEASE_TIMEOUT_MS: ${DELIVERY_LEASE_TIMEOUT_MS:-60000}
      STALE_RECOVERY_INTERVAL_MS: ${STALE_RECOVERY_INTERVAL_MS:-30000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
      ALLOW_LOCAL_WEBHOOKS: 'false'
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_RECEIVER_URL: ${SANDBOX_RECEIVER_URL:-http://api:3000/sandbox/receiver}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - eventforge-net

volumes:
  postgres_prod_data:
    name: eventforge_prod_postgres_data
  redis_prod_data:
    name: eventforge_prod_redis_data

networks:
  eventforge-net:
    name: eventforge_prod_net
